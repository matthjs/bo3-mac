name: BO3Launcher
options:
  bundleIdPrefix: com.matthjs
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: J497DX6ZF8
  configs:
    Debug:
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: Apple Development
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: Developer ID Application
      ENABLE_HARDENED_RUNTIME: true

targets:
  BO3Launcher:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
        # Wired up through INFOPLIST_FILE and entitlements, not shipped as files.
        excludes:
          - Info.plist
          - BO3Launcher.entitlements
    postBuildScripts:
      - script: |
          mkdir -p "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources"
          cp -f "${PROJECT_DIR}/Resources/BO3MacFix.tar.gz" "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources/BO3MacFix.tar.gz"
          # Built from source rather than copied from a checked-in binary, which
          # went stale once and shipped an old shim. build.sh signs it with the
          # Developer ID when that identity is present; notarization rejects an
          # ad-hoc signature here, and codesign --deep does not reach a loose
          # dylib in Resources.
          "${PROJECT_DIR}/rumble-shim/build.sh" > /dev/null
          cp -f "${PROJECT_DIR}/rumble-shim/libdualsense_rumble.dylib" "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources/DualSenseRumble.dylib"
        name: Bundle BO3MacFix
        basedOnDependencyAnalysis: false
      - script: |
          # Valve's libsteam_api.dylib is x86_64 only, so this helper must be too.
          # It lives in MacOS/ and gets signed, otherwise notarization rejects it.
          SRC="${PROJECT_DIR}/vendor/steam-unsub"
          clang -arch x86_64 -O2 -Wall -o "$SRC/steam-unsub" "$SRC/steam-unsub.c"
          DEST="${BUILT_PRODUCTS_DIR}/${EXECUTABLE_FOLDER_PATH}/steam-unsub"
          cp -f "$SRC/steam-unsub" "$DEST"
          if [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            codesign --force --timestamp=none \
              --sign "${EXPANDED_CODE_SIGN_IDENTITY}" "$DEST"
          fi
        name: Build steam-unsub helper
        basedOnDependencyAnalysis: false
      - script: |
          # Replaces the game's AppBundleExe so Steam's Play button opens the
          # launcher. Built here, not on the player's Mac, so Steam integration
          # works without Xcode's command line tools. It never loads into the
          # game, so it can be universal. Signed like steam-unsub, for notarization.
          DEST="${BUILT_PRODUCTS_DIR}/${EXECUTABLE_FOLDER_PATH}/SteamRedirector"
          clang -arch x86_64 -arch arm64 -mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET} \
            -O2 -Wall -framework Foundation -framework AppKit \
            -DLAUNCHER_BUNDLE_ID="\"${PRODUCT_BUNDLE_IDENTIFIER}\"" \
            -o "$DEST" "${PROJECT_DIR}/vendor/SteamRedirector.m"
          if [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            codesign --force --timestamp=none \
              --sign "${EXPANDED_CODE_SIGN_IDENTITY}" "$DEST"
          fi
        name: Build SteamRedirector
        basedOnDependencyAnalysis: false
    entitlements:
      path: Resources/BO3Launcher.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matthjs.bo3launcher
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: BO3 Launcher
        MARKETING_VERSION: "2.0.2"
        CURRENT_PROJECT_VERSION: 10
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: ""
